services:
  - type: web
    name: masmercat-backend
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    preDeployCommand: npm run migration:run:prod
    startCommand: npm run start:prod
    healthCheckPath: /auth/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: TYPEORM_SYNCHRONIZE
        value: "false"
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRATION
        value: 7d
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_S3_BUCKET
        sync: false
      - key: AWS_S3_PUBLIC_BASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ADMIN_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ML_VISION_ENDPOINT
        sync: false
      - key: ML_VISION_API_KEY
        sync: false
      - key: ML_VISION_TIMEOUT_MS
        value: "8000"
      - key: ML_VISION_MIN_CONFIDENCE
        value: "0.45"
      - key: ML_VISION_PREFER_DETECTOR
        value: "true"

  - type: web
    name: masmercat-web-beta
    runtime: static
    rootDir: web-static
    buildCommand: test -f index.html && test -f main.dart.js
    staticPublishPath: .
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
